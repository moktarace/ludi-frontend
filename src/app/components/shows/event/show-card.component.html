<article class="program-card" [class.program-card-primary]="variant === 'primary'" [class.program-card-compact]="variant === 'compact'">
  <div class="program-card-media">
    <img
      [src]="show?.logoLink || 'assets/event/noimg.png'"
      loading="lazy"
      [class.kit-logo-image]="isKitLogo"
      [alt]="show?.name || 'Spectacle de la LUDI'"
    />
    <span *ngIf="variant === 'primary'" class="program-card-label">À l'affiche</span>
  </div>
  <div class="program-card-content">
    <div class="program-card-banners">
      <p class="program-card-date">{{ formattedDate }} à {{ formattedTime }}</p>
      <p class="program-card-venue">{{ show?.location }}</p>
    </div>
    <h2>{{ show?.name }}</h2>
    <div class="program-card-meta">
      <span>{{ priceLabel }}</span>
      <span>{{ show?.reservationLink ? 'Réservation conseillée' : 'Sans réservation' }}</span>
      <span *ngIf="show?.freeForStudents">Gratuit pour les étudiant·e·s</span>
    </div>
    <p *ngIf="show?.shortDescription" class="program-card-description">
      {{ show?.shortDescription }}
    </p>
    <div class="program-card-action" *ngIf="show?.reservationLink">
      <app-show-reservation-buttons [show]="show"></app-show-reservation-buttons>
    </div>
  </div>
</article>
